# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Bluetooth Scales
    description                           : Works with 17 scale models. Tested on hardware - Acaia Pearl, BOOKOO Themis Ultra, DiFluid Microbalance and Microbalance Ti, Futula Kitchen Scale 3 (aka LFScale CK811, LEFU CK811 and CK811BLE), KP2048B, TIMEMORE Dot, and Xiaomi HOTO Smart Kitchen Scale. Protocol support, feedback welcome - Acaia Lunar/Pyxis/Cinco, Atomax Skale II, BOOKOO Themis Mini, Decent Scale, Half Decent, EspressiScale, DIY Coffee Scale, Eclair, Eureka Precisa, Felicita Arc, IKAPE A01, INSMART 863A, Tencent (DSD TECH), TIMEMORE Basic 3, TIMEMORE Black Mirror, Varia AKU, WeighMyBru.
    fontawesome_icon_name                 : wifi

  - title                                 : Timer
    description                           : Provides timer (stopwatch) for your brewing.
    fontawesome_icon_name                 : stopwatch
    
  - title                                 : Weight
    description                           : Gets weight values in grams from the scale via Bluetooth in real time.
    fontawesome_icon_name                 : dumbbell

  - title                                 : Flowrate
    description                           : Calculates flowrate (gramms per second) in real-time.
    fontawesome_icon_name                 : fill-drip

  - title                                 : Brew Ratio
    description                           : Gives you ability to save dose and calculates brew ratio (BR) in real-time during brewing.
    fontawesome_icon_name                 : percent

  - title                                 : Charts
    description                           : When you start the timer it draws total weight chart and flowrate chart.
    fontawesome_icon_name                 : chart-line

  - title                                 : iPhone Duo
    description                           : Brew on the outer display or open your phone for wider weight and flow rate charts. When there is enough room, the five readings fit in a single row.
    fontawesome_icon_name                 : mobile-alt

  - title                                 : VoiceOver While Brewing
    description                           : With VoiceOver on, hear timer ticks, elapsed time every 30 seconds and weight in 10 g increments while you brew. Focus Weight and choose Read brew status for an update or to repeat the result after finishing.
    fontawesome_icon_name                 : universal-access
  
  - title                                 : Autostart
    description                           : Provides the ability to automatically start the timer with the first pour.
    fontawesome_icon_name                 : play

  - title                                 : Auto-stop
    description                           : Lift the cup off the scale when the brew is done and the timer pauses by itself. The time and the charts end at the moment the cup left the scale.
    fontawesome_icon_name                 : stop-circle

  - title                                 : Hold the Weight
    description                           : Brewing with a lid, like in a French press or a Clever Dripper? Tap HOLD once all the water is in. The weight freezes, and the lid stays out of the weight, the brew ratio and the charts. Tap LIVE to see the live weight again.
    fontawesome_icon_name                 : lock

  - title                                 : Scale Timer and Buttons
    description                           : On scales with a built-in timer, START, PAUSE and RESET in the app start, stop and reset the timer on the scale. On Acaia, BOOKOO Themis Ultra, Decent and Varia scales the timer button on the scale controls the brew in the app.
    fontawesome_icon_name                 : sync-alt

  - title                                 : Designed for One Hand
    description                           : Every control sits at the bottom of the screen, in the reach of your thumb - no need to shift the phone in your hand in the middle of a pour.
    fontawesome_icon_name                 : hand-point-up

  - title                                 : Brewing Profiles
    description                           : Draws graphs of your brewing profiles for espresso, pour-overs and drip coffee.
    fontawesome_icon_name                 : clipboard

  - title                                 : Android Version
    description                           : Has a similar application for Android devices - BeanZen. Available <a href="https://github.com/securny/beanzen/releases">here</a>.
    fontawesome_icon_name                 : robot

